aid: fable-security
name: Fable Security
description: 'Fable Security is a human risk management (HRM) platform that uses AI to reduce
  employee-driven security risk. The product combines phishing simulations and resilience testing,
  bite-sized security awareness and compliance training, behavioral interventions (AI-generated video
  briefings, nudges, and chat), human-risk reporting and analytics, rapid threat-response briefings for
  emerging threats, and secure AI-enablement programs. Fable is used across healthcare, financial
  services, and technology organizations to measure employee risk, deliver targeted training, and change
  unsafe security behavior. The company is backed by Redpoint Ventures. Note: Fable Security does not
  currently publish a public API, developer portal, or SDK; this profile captures the company''s public
  web, security posture, and product changelog surface.'
